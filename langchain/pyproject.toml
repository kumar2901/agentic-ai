[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "paper-pilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "pydantic-settings>=2.4",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mypy>=1.0", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/paper_pilot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=paper_pilot --cov-branch --cov-report=term-missing"